<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyss Atlas · 深淵圖鑑</title>
<meta name="description" content="An interactive three.js atlas of deep-sea creatures — drag, zoom and swim between six procedural 3D animals.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230f7b74'/><path d='M8 18c4-6 12-6 16 0-4 4-12 4-16 0z' fill='%23e9f7f4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="gl"></div>

<aside class="side">
  <div class="brand" data-t="brand">Abyss Atlas</div>
  <nav class="nav" id="nav">
    <button data-cat="all"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span><b data-t="home">Home</b></span></button>
    <button data-cat="feat" class="on"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><span><b data-t="featured">Featured</b></span></button>
    <button data-cat="ceph"><svg viewBox="0 0 24 24"><path d="M6 11a6 6 0 0 1 12 0v2c0 1-1 1.5-1.5 3.5M6 13c0 1 1 1.5 1.5 3.5M9.5 14.5c0 2-.5 3.5-1 5M14.5 14.5c0 2 .5 3.5 1 5M12 15v5"/></svg><span><b data-t="ceph">Cephalopods</b><i data-n="ceph"></i></span></button>
    <button data-cat="fish"><svg viewBox="0 0 24 24"><path d="M3 12c3-4.5 9-5.5 13-2l5-3v10l-5-3c-4 3.5-10 2.5-13-2z"/><circle cx="7.5" cy="11.2" r=".6"/></svg><span><b data-t="fish">Deep-sea fishes</b><i data-n="fish"></i></span></button>
  </nav>
  <div class="feat" id="feat">
    <div class="label" data-t="featLabel">Featured species</div>
    <img alt="">
    <h4></h4>
    <p></p>
    <a target="_blank" rel="noopener"><span data-t="learn">Learn more</span> <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></a>
  </div>
</aside>

<section class="carousel" id="carousel"></section>

<section id="stage" aria-label="3D viewer">
  <div class="hint" data-t="hint">Drag to rotate · scroll to zoom</div>
</section>

<div class="tools" id="tools">
  <button id="zin" class="pri" data-tip="zoomIn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
  <button id="zout" data-tip="zoomOut"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M8 11h6"/></svg></button>
  <button id="focus" data-tip="focus"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="theme" class="pri" data-tip="theme"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg></button>
</div>

<div class="rotbar" id="rotbar">
  <button id="rotL" data-tip="rotL"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4h4"/></svg></button>
  <button id="spin" data-tip="spin">360°</button>
  <button id="rotR" data-tip="rotR"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4h-4"/></svg></button>
</div>
<p class="caption" id="caption"></p>

<aside class="info">
  <div class="topbar">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg><input id="q" type="search" autocomplete="off"></label>
    <button id="lang" class="chip">中</button>
  </div>
  <article class="panel" id="panel"></article>
</aside>

<div class="loader" id="loader"><div></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
